services:
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
      # For Mac M5 (ARM64)
      platforms:
        - linux/arm64
        # Uncomment for cross-platform builds:
        # - linux/amd64
    ports:
      - "8501:8501"
    volumes:
      # Persist SQLite database
      - ./data:/app/data
      # Hot reload for development
      - ./app.py:/app/app.py
      - ./database.py:/app/database.py
      - ./utils.py:/app/utils.py
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_CLIENT_SHOWERRORDETAILS=true
    container_name: maquinas-tragamonedas
    restart: unless-stopped
    # Uncomment for Mac M5 optimization
    # platform: linux/arm64

